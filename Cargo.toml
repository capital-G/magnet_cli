[package]
name = "magnet"
version = "0.1.0"
edition = "2021"
description = "Package manager for SuperCollider"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tracing = "0.1.40"
tracing-subscriber = {version = "0.3.18", features = ["std", "env-filter", "fmt"]}
tokio = { version = "1.37.0", features = ["full"] }
clap = { version = "4.5.4", features = ["derive", "env"] }
serde = { version = "1.0.219", features = ["derive"] }
semver = { version = "1.0.26", features = ["serde"] }
serde_json = "1.0.140"
anyhow = "1.0.97"
futures-util = "0.3.31"
chrono = "0.4.40"
reqwest = {version = "0.12.23", features = ["json", "stream"] }
rand = "0.9.2"
sha2 = "0.10.9"
base64 = "0.22.1"
url = "2.5.4"
inquire = "0.7.5"
regex = "1.11.1"
pubgrub = "0.3.0"
uuid = {version = "1.18.0", features = ["serde"] }
git2 = {version = "0.20.2", default-features = false, features = ["https"]}
flate2 = "1.1.2"
tar = "0.4.44"
tempfile = "3.22.0"
indicatif = { version = "0.18.0", features = ["tokio"] }
regress = "0.10.5"
walkdir = "2.5.0"
toml = "1.1.2"
toml_edit = "0.25.12"
globset = "0.4.20"
anstream = "0.6.21"
anstyle = "1.0.13"

[build-dependencies]
typify = "0.5.0"
prettyplease = "0.2"
schemars = "0.8"
serde_json = "1.0"
syn = "2.0"

[dev-dependencies]
wiremock = "0.6.5"
