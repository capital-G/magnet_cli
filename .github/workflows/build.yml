name: build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  plugin_matrix:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-suffix: linux-x86-64
          - os: macos-latest
            artifact-suffix: macos-arm64
          - os: macos-15-intel
            artifact-suffix: macos-x86-64
          - os: windows-2022
            artifact-suffix: win-x86-64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: pre-commit/action@v3.0.0
      name: Run pre-commit

    - name: Build
      run: cargo build --verbose

    - name: Test
      run: cargo test --all --verbose
