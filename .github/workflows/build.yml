name: build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  plugin_matrix:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-suffix: linux-x86-64
          - os: macos-latest
            artifact-suffix: macos-arm64
          - os: macos-15-intel
            artifact-suffix: macos-x86-64
          - os: windows-2022
            artifact-suffix: win-x86-64
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Build
      run: cargo build --verbose

    - name: Test
      run: cargo test --all --verbose

    - name: Build release binary
      run: cargo build --release --verbose

    - name: Upload binary
      uses: actions/upload-artifact@v5
      with:
        name: magnet-${{ matrix.artifact-suffix }}
        path: |
          target/release/magnet
          target/release/magnet.exe
        if-no-files-found: error
